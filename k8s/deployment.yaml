apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyspark
  labels:
    app: studyspark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studyspark
  template:
    metadata:
      labels:
        app: studyspark
    spec:
      containers:
        - name: studyspark
          image: ghaliabellalouna/studyspark:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"